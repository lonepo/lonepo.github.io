<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Gautam</title>
  <meta name="description" content="Thoughts on electronics, open-source, AI, sustainability and more — by Gautam." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/blog.css" />

  <script>
    (function() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <style>
    /* ── Blog index extras ── */
    .blog-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .filter-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 0.3rem 0.85rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-pill:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .filter-pill.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: var(--bg-primary);
    }

    .blog-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .blog-listing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .blog-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    /* tag color helpers for JS-generated tags */
    .tag.thoughts { color: var(--accent-blue); background: rgba(77,166,255,0.08); }
    .tag.electronics { color: var(--accent-green); background: rgba(61,220,132,0.08); }
    .tag.foss { color: var(--accent-orange); background: rgba(255,140,66,0.08); }
    .tag.ai { color: var(--accent-blue); background: rgba(77,166,255,0.08); }

    @media (max-width: 600px) {
      .blog-listing-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav scrolled" id="nav">
    <a href="../" class="nav-logo">G<span class="logo-dot">.</span></a>
    <ul class="nav-links" id="nav-links">
      <li><a href="../#about" class="nav-link">About</a></li>
      <li><a href="../#projects" class="nav-link">Projects</a></li>
      <li><a href="../blog/" class="nav-link active">Blog</a></li>
      <li><a href="../#contact" class="nav-link">Contact</a></li>
    </ul>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="blog-page-header">
    <div class="container">
      <div class="section-label">Writing</div>
      <h1 class="blog-page-title">Blog</h1>
      <p class="blog-page-sub">Thoughts on electronics, open-source, AI, sustainability, and whatever else is on my mind.</p>
    </div>
  </header>

  <!-- POSTS LISTING -->
  <main class="blog-listing">
    <div class="container">

      <!-- Tag filter pills — populated by JS -->
      <div class="blog-filters" id="blogFilters" role="group" aria-label="Filter by tag"></div>

      <!-- Post count -->
      <p class="blog-count" id="blogCount" aria-live="polite"></p>

      <!-- Cards grid — populated by JS -->
      <div class="blog-listing-grid" id="blogGrid" aria-label="Blog posts"></div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>Built with ♥ · <a href="../" style="color:var(--accent-green)">← Back to portfolio</a></p>
    </div>
  </footer>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // ── Theme ────────────────────────────────────────────
    document.getElementById('themeToggle').addEventListener('click', () => {
      const h = document.documentElement;
      const next = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      h.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // ── Hamburger ────────────────────────────────────────
    const ham = document.getElementById('hamburger');
    const nl  = document.getElementById('nav-links');
    ham?.addEventListener('click', () => nl.classList.toggle('open'));

    // ── Tag colour map ───────────────────────────────────
    const tagColour = (tag) => {
      const map = {
        thoughts: 'blue', electronics: 'green', foss: 'orange',
        ai: 'blue', linux: 'orange', hardware: 'green', sustainability: 'green',
      };
      return map[tag.toLowerCase()] || 'blue';
    };

    // ── Build a card element ─────────────────────────────
    function buildCard(post) {
      const a = document.createElement('a');
      a.href = `${post.slug}.html`;
      a.className = 'blog-card';
      a.dataset.tags = post.tags.join(' ');
      a.innerHTML = `
        <div class="blog-card-meta">
          <span class="blog-date">${post.dateLabel}</span>
          <span class="blog-read-time">${post.readTime}</span>
        </div>
        <h2 class="blog-card-title">${post.title}</h2>
        <p class="blog-card-excerpt">${post.excerpt}</p>
        <div class="blog-card-tags">
          ${post.tags.map(t => `<span class="tag ${tagColour(t)}">${t}</span>`).join('')}
        </div>
        <span class="blog-card-cta">Read post →</span>`;
      return a;
    }

    // ── Render cards with GSAP stagger ───────────────────
    function renderCards(posts) {
      const grid = document.getElementById('blogGrid');
      const count = document.getElementById('blogCount');
      grid.innerHTML = '';

      if (!posts.length) {
        grid.innerHTML = '<p class="blog-empty">No posts match this filter.</p>';
        count.textContent = '';
        return;
      }

      count.textContent = `${posts.length} post${posts.length === 1 ? '' : 's'}`;

      posts.forEach(post => grid.appendChild(buildCard(post)));

      gsap.from(grid.querySelectorAll('.blog-card'), {
        opacity: 0,
        y: 30,
        duration: 0.55,
        stagger: 0.1,
        ease: 'power3.out',
        clearProps: 'all',
      });
    }

    // ── Build filter pills ───────────────────────────────
    function buildFilters(allPosts) {
      const filtersEl = document.getElementById('blogFilters');
      const allTags = [...new Set(allPosts.flatMap(p => p.tags))].sort();

      let activeTag = 'all';

      function filter(tag) {
        activeTag = tag;
        filtersEl.querySelectorAll('.filter-pill').forEach(p => {
          p.classList.toggle('active', p.dataset.tag === tag);
        });
        const shown = tag === 'all'
          ? allPosts
          : allPosts.filter(p => p.tags.includes(tag));
        renderCards(shown);
      }

      // "All" pill
      const allPill = document.createElement('button');
      allPill.className = 'filter-pill active';
      allPill.textContent = 'All';
      allPill.dataset.tag = 'all';
      allPill.addEventListener('click', () => filter('all'));
      filtersEl.appendChild(allPill);

      allTags.forEach(tag => {
        const pill = document.createElement('button');
        pill.className = 'filter-pill';
        pill.textContent = tag;
        pill.dataset.tag = tag;
        pill.addEventListener('click', () => filter(tag));
        filtersEl.appendChild(pill);
      });
    }

    // ── Fetch posts.json, sort newest-first, render ──────
    fetch('posts.json')
      .then(r => r.json())
      .then(posts => {
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));
        buildFilters(posts);
        renderCards(posts);
      })
      .catch(() => {
        document.getElementById('blogGrid').innerHTML =
          '<p class="blog-empty">Could not load posts. Try refreshing.</p>';
      });
  </script>
</body>
</html>
